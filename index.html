  .noscript { max-width: 44rem; margin: 2rem auto; padding: 1rem; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .cards a { transition: none; }
  }
  @media (max-width: 920px) {
    header { min-height: 60px; padding: .62rem .85rem .75rem; grid-template-columns: minmax(0, 1fr) auto; gap: .6rem .8rem; }
    .global-search { grid-column: 1 / -1; grid-row: 2; }
    .header-meta { display: none; }
    #layout { width: 100%; min-width: 0; flex-direction: column; }
    nav { width: 100%; min-width: 0; display: flex; overflow-x: auto; border-right: none; border-bottom: 1px solid rgba(0,0,0,.16); padding: .45rem .5rem; }
    nav .navhead { display: none; }
    nav a { min-height: 34px; padding: .34rem .62rem; white-space: nowrap; border-left: 0; border-bottom: 2px solid transparent; }
    nav a.active { border-left: 0; border-bottom-color: var(--nav-accent); }
    #list { width: 100%; min-width: 0; max-height: 34vh; border-right: none; border-bottom: 1px solid var(--border); }
    #filterwrap { padding-top: .72rem; }
    #filterwrap::before { top: 1.1rem; }
    #detail { width: 100%; padding: 2rem 1.15rem 3.5rem; }
  }
  @media (max-width: 560px) {
    header .tag { max-width: 15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand-mark { width: 34px; height: 34px; }
    .theme-toggle { width: 34px; padding: 0; justify-content: center; }
    .theme-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .global-search button { width: 42px; padding: 0; font-size: 0; }
    .global-search button::before { content: "⌕"; font-size: 1rem; }
    #list { max-height: 30vh; }
    .abilities { grid-template-columns: repeat(3, minmax(64px, 1fr)); }
    .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cards a { padding: .75rem .8rem .85rem; }
    .landing h2 { font-size: 2rem; }
    .resource-grid, .provenance-grid { grid-template-columns: 1fr; }
    .section-heading { display: block; }
    .section-heading p { margin-top: .18rem; }
  }
</style>
</head>
<body>
<a class="skip-link" href="#detail">Skip to record</a>
<header>
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">5.2</span>
    <div class="brand-copy">
      <h1><a href="#/">SRD 5.2.1 System JSON</a></h1>
      <span class="tag">Source-faithful JSON-LD reference corpus</span>
    </div>
  </div>
  <form class="global-search" id="global-search-form" role="search">
    <label class="visually-hidden" for="global-search">Search the full corpus</label>
    <input id="global-search" type="search" placeholder="Search all records…" autocomplete="off" />
    <button type="submit">Search</button>
  </form>
  <div class="header-actions">
    <span class="header-meta">Open data · CC BY 4.0</span>
    <button class="theme-toggle" id="theme-toggle" type="button">
      <span class="theme-icon" aria-hidden="true">☀</span>
      <span class="theme-label">Light</span>
    </button>
  </div>
</header>
<div id="layout">
  <nav id="nav" aria-label="Collections"></nav>
  <div id="list">
    <div id="filterwrap"><input id="filter" type="search" placeholder="Filter…" aria-label="Filter current collection" autocomplete="off" /></div>
    <div id="filterhint">Filter this collection by name or summary</div>
    <div id="items"></div>
  </div>
  <main id="detail" tabindex="-1">
    <noscript>
      <section class="noscript">
        <h2>SRD 5.2.1 System JSON</h2>
        <p>JavaScript is required for the interactive explorer. The corpus remains available as static files:</p>
        <p><a href="objects/srd52-system-data.bundle.jsonld">JSON-LD bundle</a> · <a href="llms-full.txt">full text context</a> · <a href="SPECIFICATION.md">technical specification</a></p>
      </section>
    </noscript>
  </main>
</div>
<script>
(function () {
  "use strict";
  var LABELS = {
    classes: "Classes", subclasses: "Subclasses", species: "Species",
    backgrounds: "Backgrounds", feats: "Feats", equipment: "Equipment",
    spells: "Spells", conditions: "Conditions",
    "magic-items": "Magic Items", monsters: "Monsters",
    rules: "Rules", tables: "Tables", sources: "Sources"
  };
  var NAV_ORDER = ["classes", "subclasses", "species", "backgrounds", "feats",
    "equipment", "spells", "conditions", "magic-items", "monsters",
    "rules", "tables", "sources"];
  var colIndex = null, searchIndex = null, searchIndexPromise = null;
  var route = { collection: null, slug: null, search: null };

  var nav = document.getElementById("nav");
  var items = document.getElementById("items");
  var detail = document.getElementById("detail");
  var filter = document.getElementById("filter");
  var globalSearchForm = document.getElementById("global-search-form");
  var globalSearch = document.getElementById("global-search");
  var themeToggle = document.getElementById("theme-toggle");

  function currentTheme() {
    var selected = document.documentElement.getAttribute("data-theme");
    if (selected) return selected;
    return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }

  function updateThemeToggle() {
    var nextTheme = currentTheme() === "dark" ? "light" : "dark";
    themeToggle.setAttribute("aria-label", "Use " + nextTheme + " theme");
    themeToggle.setAttribute("title", "Use " + nextTheme + " theme");
    themeToggle.querySelector(".theme-icon").textContent = nextTheme === "light" ? "☀" : "☾";
    themeToggle.querySelector(".theme-label").textContent = nextTheme === "light" ? "Light" : "Dark";
  }

  themeToggle.addEventListener("click", function () {
    var nextTheme = currentTheme() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", nextTheme);
    try { localStorage.setItem("graph20-theme", nextTheme); } catch (error) { /* optional */ }
    updateThemeToggle();
  });
  var systemTheme = window.matchMedia("(prefers-color-scheme: dark)");
  if (systemTheme.addEventListener) {
    systemTheme.addEventListener("change", function () {
      if (!document.documentElement.hasAttribute("data-theme")) updateThemeToggle();
    });
  }
  updateThemeToggle();

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  function link(href, cls) {
    var a = document.createElement("a");
    a.href = href; if (cls) a.className = cls;
    return a;
  }

  fetch("objects/collection-index.json")
    .then(function (r) { return r.json(); })
    .then(function (data) {
      colIndex = data.collections;
      window.addEventListener("hashchange", onRoute);
      onRoute();
    });

  function onRoute() {
    var hash = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
    var parts = hash.split("/").filter(Boolean);
    if (parts[0] === "search") {
      route = { collection: null, slug: null, search: parts.slice(1).join("/") };
      globalSearch.value = route.search;
      filter.value = "";
      renderNav();
      runGlobalSearch(route.search);
      return;
    }
    route = { collection: parts[0] || null, slug: parts[1] || null, search: null };
    globalSearch.value = "";
    renderNav();
    if (!route.collection || !colIndex[route.collection]) {
      route.collection = null;
      renderList(null);
      renderLanding();
      return;
    }
    renderList(route.collection);
    if (route.slug) {
      showRecord(route.collection, route.slug);
    } else {
      renderCollectionIntro(route.collection);
    }
  }

  function renderNav() {
    nav.textContent = "";
    nav.appendChild(el("div", "navhead", "Browse"));
    NAV_ORDER.forEach(function (name) {
      if (!colIndex[name]) return;
      var a = link("#/" + name, route.collection === name ? "active" : "");
      if (route.collection === name) a.setAttribute("aria-current", "page");
      a.appendChild(el("span", null, LABELS[name] || name));
      a.appendChild(el("span", "count", String(colIndex[name].length)));
      nav.appendChild(a);
    });
  }

  // ---- list pane -----------------------------------------------------

  function renderList(collection, filterText) {
    document.getElementById("list").classList.toggle("is-idle", !collection);
    document.getElementById("list").classList.remove("is-searching");
    items.textContent = "";
    if (!collection) {
      filter.placeholder = "Search the full corpus…";
      items.appendChild(el("p", "placeholder", "Pick a collection above, or press Enter in the box to search everything."));
      return;
    }
    filter.placeholder = "Filter " + (LABELS[collection] || collection).toLowerCase() + "…";
    var needle = (filterText || "").toLowerCase();
    var lastGroup = null, shown = 0, activeItem = null;
    colIndex[collection].forEach(function (entry) {
      if (needle &&
          entry.name.toLowerCase().indexOf(needle) === -1 &&
          entry.sub.toLowerCase().indexOf(needle) === -1 &&
          (entry.group || "").toLowerCase().indexOf(needle) === -1) return;
      if (entry.group !== lastGroup) {
        items.appendChild(el("div", "group", entry.group));
        lastGroup = entry.group;
      }
      var a = link("#/" + collection + "/" + entry.slug,
        route.slug === entry.slug ? "active" : "");
      if (route.slug === entry.slug) {
        a.setAttribute("aria-current", "page");
        activeItem = a;
      }
      a.appendChild(el("span", "nm", entry.name));
      if (entry.sub) a.appendChild(el("span", "sub", entry.sub));
      items.appendChild(a);
      shown += 1;
    });
    if (!shown) items.appendChild(el("p", "placeholder", "No matches in this collection. Press Enter to search everything."));
    if (activeItem) activeItem.scrollIntoView({ block: "nearest" });
  }

  var filterTimer = null;
  filter.addEventListener("input", function () {
    clearTimeout(filterTimer);
    filterTimer = setTimeout(function () {
      if (route.collection) renderList(route.collection, filter.value.trim());
    }, 120);
  });
  globalSearchForm.addEventListener("submit", function (event) {
    event.preventDefault();
    var query = globalSearch.value.trim();
    if (query) location.hash = "#/search/" + encodeURIComponent(query);
  });

  function ensureSearchIndex() {
    if (!searchIndexPromise) {
      searchIndexPromise = fetch("objects/search-index.json")
        .then(function (r) { return r.json(); })
        .then(function (idx) { searchIndex = idx; return idx; });
    }
    return searchIndexPromise;
  }

  function runGlobalSearch(query) {
    document.getElementById("list").classList.remove("is-idle");
    document.getElementById("list").classList.add("is-searching");
    items.textContent = "";
    items.appendChild(el("p", "placeholder", "Searching…"));
    detail.textContent = "";
    detail.appendChild(el("p", "placeholder", "Full-text results for “" + query + "” are in the list."));
    var terms = query.toLowerCase().split(/\s+/).filter(function (t) { return t.length >= 3; });
    if (!terms.length) {
      items.textContent = "";
      items.appendChild(el("p", "placeholder", "Search terms need at least 3 characters."));
      return;
    }
    ensureSearchIndex().then(function (idx) {
      var hits = null;
      terms.forEach(function (term) {
        var matched = {};
        Object.keys(idx.tokens).forEach(function (token) {
          if (token.indexOf(term) === 0) {
            idx.tokens[token].forEach(function (posting) {
              matched[posting.document] = posting.excerpt;
            });
          }
        });
        hits = hits === null ? matched : intersect(hits, matched);
      });
      items.textContent = "";
      var allDocs = Object.keys(hits || {}).map(Number);
      var docs = allDocs.slice(0, 300);
      if (!docs.length) {
        items.appendChild(el("p", "placeholder", "No matches anywhere."));
        return;
      }
      var countLabel = allDocs.length > docs.length
        ? "First " + docs.length + " of " + allDocs.length + " results"
        : docs.length + " results";
      items.appendChild(el("div", "group", countLabel));
      docs.forEach(function (docIndex) {
        var doc = idx.documents[docIndex];
        var pathParts = doc.id.split("/"); // objects/<collection>/<slug>
        var a = link("#/" + pathParts[1] + "/" + pathParts[2]);
        a.appendChild(el("span", "nm", doc.name));
        var matchedExcerpt = (hits || {})[docIndex] || doc.excerpt;
        a.appendChild(el("span", "sub", (LABELS[pathParts[1]] || doc.type) +
          (matchedExcerpt ? " · " + matchedExcerpt : "")));
        items.appendChild(a);
      });
    });
  }
  function intersect(a, b) {
    var out = {};
    Object.keys(a).forEach(function (k) { if (b[k]) out[k] = a[k] || b[k]; });
    return out;
  }

  // ---- detail pane ---------------------------------------------------

  function renderLanding() {
    detail.textContent = "";
    var box = el("div", "landing");
    var total = NAV_ORDER.reduce(function (sum, name) {
      return sum + (colIndex[name] ? colIndex[name].length : 0);
    }, 0);
    var browsable = total - (colIndex.sources ? colIndex.sources.length : 0);

    box.appendChild(el("h2", null, "System Reference Document 5.2.1, as connected data"));
    box.appendChild(el("p", "lede",
      "A browsable, machine-readable reference corpus built from the Creative Commons SRD 5.2.1. " +
      "Records preserve source wording alongside typed fields, graph links, and line-level provenance. " +
      "Browse a collection, filter its entries, or use the header search to search across the corpus."));

    var meta = el("div", "landing-meta");
    [total.toLocaleString() + " records", NAV_ORDER.length + " collections", "JSON-LD 1.1",
      "JSON Schema 2020-12", "v0.4.0"].forEach(function (label) {
      meta.appendChild(el("span", null, label));
    });
    box.appendChild(meta);

    var browseHeading = el("div", "section-heading");
    browseHeading.appendChild(el("h3", null, "Browse the corpus"));
    browseHeading.appendChild(el("p", null, browsable.toLocaleString() + " rules and game-reference records"));
    box.appendChild(browseHeading);
    var cards = el("div", "cards");
    NAV_ORDER.forEach(function (name) {
      if (!colIndex[name] || name === "sources") return;
      var a = link("#/" + name);
      a.appendChild(el("span", "n", String(colIndex[name].length)));
      a.appendChild(el("span", "l", LABELS[name]));
      cards.appendChild(a);
    });
    box.appendChild(cards);

    var dataHeading = el("div", "section-heading");
    dataHeading.appendChild(el("h3", null, "Use the data"));
    dataHeading.appendChild(el("p", null, "Download, integrate, validate, or cite the corpus"));
    box.appendChild(dataHeading);

    var resources = el("div", "resource-grid");
    appendResourceGroup(resources, "Corpus downloads", "Primary data artifacts for applications and offline use.", [
      ["objects/srd52-system-data.bundle.jsonld", "Self-contained bundle", "All records in one @graph · about 5 MB", "JSON-LD"],
      ["objects/srd52-system-data.jsonld", "Aggregate manifest", "Collection membership, schemas, and corpus digest", "JSON-LD"],
      ["datapackage.json", "Frictionless Data Package", "Portable dataset metadata and resource listing", "JSON"],
      ["SRD_CC_v5.2.1.md", "Authoritative source", "Local CC-BY-4.0 source markdown", "Markdown"]
    ]);
    appendResourceGroup(resources, "LLM and discovery", "Text projections and indexes for retrieval workflows.", [
      ["llms-full.txt", "Full corpus context", "Single plain-text context file · about 2 MB", "Text"],
      ["llms.txt", "LLM entry-point map", "Compact guide to corpus resources", "Text"],
      ["objects/search-index.json", "Full-text search index", "Static inverted token index used by this explorer", "JSON"],
      ["objects/collection-index.json", "Collection index", "Names, slugs, groups, and display metadata", "JSON"],
      ["sitemap.xml", "Record sitemap", "Canonical URLs for web discovery", "XML"]
    ]);
    appendResourceGroup(resources, "Model and validation", "Semantic vocabulary and machine-validation contracts.", [
      ["systems/context.jsonld", "JSON-LD context", "Terms, prefixes, and IRI coercion", "JSON-LD"],
      ["vocab/", "Vocabulary reference", "Dereferenceable classes and properties", "HTML"],
      ["systems/system.schema.json", "System manifest schema", "Top-level Draft 2020-12 schema", "Schema"],
      ["systems/common.schema.json", "Common entity schema", "Shared identity and provenance fields", "Schema"]
    ], true);
    appendResourceGroup(resources, "Documentation and citation", "Technical architecture, citation metadata, and repository source.", [
      ["SPECIFICATION.md", "Technical specification", "Authoritative architecture and extraction rules", "Markdown"],
      ["CITATION.cff", "Citation metadata", "Preferred project citation", "CFF"],
      ["https://github.com/klrkdekira/graph20", "GitHub repository", "Source code, issues, and build history", "GitHub"]
    ]);
    box.appendChild(resources);

    var provenance = el("div", "provenance-grid");
    var sourceInfo = el("section");
    sourceInfo.appendChild(el("h3", null, "Source provenance"));
    sourceInfo.appendChild(el("p", null,
      "The authoritative in-scope source is the local System Reference Document 5.2.1 markdown. " +
      "Each record includes a source node and chapter, section, heading, and line bounds where available."));
    appendInlineLinks(sourceInfo, [
      ["SRD_CC_v5.2.1.md", "Read source"],
      ["#/sources/srd-5-2-1", "Source record"],
      ["https://www.dndbeyond.com/srd", "Official SRD"]
    ]);
    provenance.appendChild(sourceInfo);

    var rightsInfo = el("section");
    rightsInfo.appendChild(el("h3", null, "Rights and reuse"));
    rightsInfo.appendChild(el("p", null,
      "SRD material is available under CC BY 4.0. Repository-authored code, schemas, and documentation are MIT licensed. " +
      "This is an independent, unofficial project and is not affiliated with Wizards of the Coast."));
    appendInlineLinks(rightsInfo, [
      ["https://creativecommons.org/licenses/by/4.0/legalcode", "CC BY 4.0"],
      ["LICENSE", "MIT License"],
      ["CITATION.cff", "How to cite"]
    ]);
    provenance.appendChild(rightsInfo);
    box.appendChild(provenance);

    box.appendChild(el("p", "attribution",
      "This work includes material from the System Reference Document 5.2.1 (“SRD 5.2.1”) " +
      "by Wizards of the Coast LLC, available at https://www.dndbeyond.com/srd. The SRD 5.2.1 " +
      "is licensed under the Creative Commons Attribution 4.0 International License. " +
      "Independent, unofficial project — not affiliated with Wizards of the Coast."));
    detail.appendChild(box);
  }

  function appendResourceGroup(parent, title, description, entries, includeSchemas) {
    var group = el("section", "resource-group");
    group.appendChild(el("h4", null, title));
    group.appendChild(el("p", null, description));
    var listNode = el("ul", "resource-list");
    entries.forEach(function (entry) {
      var li = el("li");
      var a = link(entry[0], "resource-link");
      if (/^https?:/.test(entry[0])) {
        a.target = "_blank";
        a.rel = "noopener noreferrer";
      }
      var copy = el("span");
      copy.appendChild(el("span", "resource-name", entry[1]));
      copy.appendChild(el("span", "resource-detail", entry[2]));
      a.appendChild(copy);
      a.appendChild(el("span", "resource-type", entry[3]));
      li.appendChild(a);
      listNode.appendChild(li);
    });
    group.appendChild(listNode);
    if (includeSchemas) appendSchemaLinks(group);
    parent.appendChild(group);
  }

  function appendSchemaLinks(parent) {
    var details = el("details", "schema-details");
    details.appendChild(el("summary", null, "All collection schemas"));
    var links = el("div", "schema-links");
    ["background", "class", "condition", "equipment", "feat", "magic-item", "monster",
      "rule", "source", "species", "spell", "subclass", "table"].forEach(function (name) {
      var a = link("systems/" + name + ".schema.json");
      a.textContent = name;
      links.appendChild(a);
    });
    details.appendChild(links);
    parent.appendChild(details);
  }

  function appendInlineLinks(parent, entries) {
    var links = el("div", "project-links");
    entries.forEach(function (entry) {
      var a = link(entry[0]);
      a.textContent = entry[1];
      if (/^https?:/.test(entry[0])) {
        a.target = "_blank";
        a.rel = "noopener noreferrer";
      }
      links.appendChild(a);
    });
    parent.appendChild(links);
  }

  function renderCollectionIntro(collection) {
    detail.textContent = "";
    var box = el("div", "landing collection-intro");
    box.appendChild(el("h2", null, LABELS[collection] || collection));
    box.appendChild(el("p", "lede", colIndex[collection].length +
      " records. Select one from the list, or type to filter."));
    detail.appendChild(box);
  }

  function showRecord(collection, slug) {
    detail.textContent = "";
    detail.appendChild(el("p", "placeholder", "Loading…"));
    var path = "objects/" + collection + "/" + slug + ".jsonld";
    fetch(path).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    }).then(function (record) {
      detail.textContent = "";
      var box = el("div", "record");
      var heading = el("div", "record-heading");
      heading.appendChild(el("h2", null, record.name || slug));
      heading.appendChild(el("span", "entity-type", humanizeType(record["@type"] || "Record")));
      box.appendChild(heading);

      var subtitle = recordSubtitle(record);
      if (subtitle) box.appendChild(el("p", "subtitle", subtitle));

      var locator = record.sourceLocator;
      var prov = el("p", "provenance");
      if (locator) prov.appendChild(document.createTextNode(
        "SRD 5.2.1 · " + locator.chapter + " §" + locator.section +
        " · lines " + locator.lineStart + "–" + locator.lineEnd + " · "));
      if (locator) box.appendChild(prov);

      var recordLinks = el("div", "source-links");
      var rawLink = link(path); rawLink.textContent = "Raw JSON-LD";
      recordLinks.appendChild(rawLink);
      if (locator && locator.lineStart) {
        var sourceUrl = "https://github.com/klrkdekira/graph20/blob/main/SRD_CC_v5.2.1.md?plain=1#L" +
          locator.lineStart + (locator.lineEnd ? "-L" + locator.lineEnd : "");
        var sourceLink = link(sourceUrl); sourceLink.textContent = "View source lines";
        sourceLink.target = "_blank"; sourceLink.rel = "noopener noreferrer";
        recordLinks.appendChild(sourceLink);
      }
      if (record.canonicalUrl) {
        var canonicalLink = link(record.canonicalUrl["@id"]); canonicalLink.textContent = "Canonical source";
        canonicalLink.target = "_blank"; canonicalLink.rel = "noopener noreferrer";
        recordLinks.appendChild(canonicalLink);
      }
      if (record.licenseUrl) {
        var licenseLink = link(record.licenseUrl["@id"]); licenseLink.textContent = record.license || "License";
        licenseLink.target = "_blank"; licenseLink.rel = "noopener noreferrer";
        recordLinks.appendChild(licenseLink);
      }
      box.appendChild(recordLinks);

      renderFacts(box, record);
      if (record.coreTraits) {
        var grid = el("div", "facts");
        record.coreTraits.forEach(function (trait) {
          var fact = el("div", "fact");
          fact.appendChild(el("span", "k", trait.name));
          fact.appendChild(el("span", "v", trait.value));
          grid.appendChild(fact);
        });
        box.appendChild(grid);
      }
      if (record.abilities) renderAbilities(box, record.abilities);
      if (record.columns) renderDataTable(box, record.columns, record.rows);
      if (Array.isArray(record.damage)) renderDamageDetails(box, record.damage);
      if (record.attacks) renderAttackDetails(box, record.attacks);
      renderRelations(box, record);

      if (record["@type"] === "Species" && record.traits) {
        // Creature type/size/speed are in the subtitle; traits render as
        // headed sections below. Verbatim text stays in the raw JSON.
      } else if (record["@type"] === "Monster" && record.statSections) {
        // The stat lines are already shown in the facts/ability grids and the
        // verbatim text stays in the raw JSON below; render the named
        // sections (Traits, Actions, ...) as headed blocks.
        record.statSections.forEach(function (section) {
          box.appendChild(el("h3", "sect", section.name));
          box.appendChild(el("div", "prose", section.rulesText));
        });
      } else if (record.rulesText) {
        var text = stripSubtitle(record.rulesText, subtitle);
        if (record["@type"] === "Spell") {
          // Casting Time/Range/Components/Duration are already in the facts
          // grid; hide the duplicated header lines in display only.
          text = text.replace(/^(?:(?:Casting Time|Range|Components|Duration):[^\n]*\n+)+/, "");
        }
        box.appendChild(el("div", "prose", text));
      }
      (record.features || []).forEach(function (feature) {
        var title = (feature.level ? "Level " + feature.level + ": " : "") + feature.name;
        box.appendChild(el("h3", "sect", title));
        if (feature.rulesText) box.appendChild(el("div", "prose", feature.rulesText));
      });
      (record.traits || []).forEach(function (trait) {
        box.appendChild(el("h3", "sect", trait.name));
        box.appendChild(el("div", "prose", trait.rulesText));
      });
      var raw = el("details", "raw");
      raw.appendChild(el("summary", null, "Raw record JSON"));
      raw.appendChild(el("pre", null, JSON.stringify(record, null, 2)));
      box.appendChild(raw);
      detail.appendChild(box);
      detail.scrollTop = 0;
      renderList(collection, filter.value.trim());
    }).catch(function () {
      detail.textContent = "";
      detail.appendChild(el("p", "placeholder", "Could not load " + path));
    });
  }

  function recordSubtitle(record) {
    if (record["@type"] === "Spell") {
      var lvl = record.level === 0 ? record.school + " Cantrip" : "Level " + record.level + " " + record.school;
      return lvl + " (" + (record.classAvailability || []).join(", ") + ")";
    }
    if (record["@type"] === "Monster") return record.sizeTypeAlignment || "";
    if (record["@type"] === "MagicItem") {
      var rarityText = record.rarity || (record.rarities || []).map(function (entry) {
        return entry.rarity + (entry.variant ? " (" + entry.variant + ")" : "");
      }).join(", ");
      var s = record.itemCategory + (record.categoryDetail ? " (" + record.categoryDetail + ")" : "") + ", " + rarityText;
      if (record.attunementNote) s += " (" + record.attunementNote + ")";
      return s;
    }
    if (record["@type"] === "Feat") {
      return record.category + " Feat" + (record.prerequisite ? " (Prerequisite: " + record.prerequisite + ")" : "");
    }
    if (record["@type"] === "Species") {
      return [record.creatureType, record.size, record.speed].filter(Boolean).join(" · ");
    }
    if (record["@type"] === "Subclass") return record.parentClassName + " Subclass";
    if (record["@type"] === "Equipment") {
      if (record.equipmentType === "weapon")
        return [record.weaponCategory, record.attackType, "Weapon ·", record.damage].filter(Boolean).join(" ");
      if (record.equipmentType === "armor")
        return (record.armorCategory || "") + " Armor · AC " + record.armorClass;
      return "Adventuring Gear";
    }
    if (record["@type"] === "Condition") return "Condition";
    return "";
  }

  // The subtitle repeats the first line(s) of the verbatim prose; hide the
  // duplication in display only (raw JSON always shows the full text).
  function stripSubtitle(text, subtitle) {
    if (!subtitle) return text;
    var firstLine = text.split("\n", 1)[0].trim();
    if (firstLine.replace(/\s+/g, " ") === subtitle.replace(/\s+/g, " ")) {
      return text.slice(text.indexOf("\n") + 1).replace(/^\n+/, "");
    }
    return text;
  }

  var FACT_FIELDS = [
    ["level", "Level"], ["school", "School"], ["classAvailability", "Available To"],
    ["castingTime", "Casting Time"], ["range", "Range"], ["components", "Components"],
    ["duration", "Duration"], ["armorClass", "AC"], ["initiative", "Initiative"],
    ["hitPoints", "HP"], ["speed", "Speed"], ["skills", "Skills"],
    ["resistances", "Resistances"], ["vulnerabilities", "Vulnerabilities"],
    ["immunities", "Immunities"], ["senses", "Senses"], ["languages", "Languages"],
    ["gear", "Gear"], ["challenge", "CR"],
    ["mastery", "Mastery"], ["weight", "Weight"],
    ["strengthRequirement", "Strength"], ["stealthEffect", "Stealth"],
    ["donDoffTime", "Don/Doff"], ["savingThrowAbility", "Save"],
    ["concentration", "Concentration"], ["ritual", "Ritual"], ["scalesWithSlotLevel", "Slot Scaling"],
    ["category", "Category"], ["prerequisite", "Prerequisite"], ["repeatable", "Repeatable"],
    ["abilityScores", "Ability Scores"], ["feat", "Feat"], ["skillProficiencies", "Skills"],
    ["toolProficiency", "Tool"], ["startingEquipment", "Starting Equipment"],
    ["creatureType", "Creature Type"], ["size", "Size"],
    ["equipmentType", "Equipment Type"], ["weaponCategory", "Weapon Category"], ["attackType", "Attack Type"],
    ["damageType", "Damage Type"], ["itemCategory", "Item Category"], ["rarity", "Rarity"],
    ["requiresAttunement", "Attunement Required"], ["attunementNote", "Attunement"],
    ["author", "Author"], ["srdVersion", "SRD Version"], ["license", "License"],
    ["sourceFile", "Source File"], ["contentDigest", "Content Digest"], ["section", "Section"]
  ];
  function renderFacts(box, record) {
    var grid = el("div", "facts");
    var count = 0;
    function fact(label, value) {
      var node = el("div", "fact");
      node.appendChild(el("span", "k", label));
      node.appendChild(el("span", "v", value));
      grid.appendChild(node);
      count += 1;
    }
    FACT_FIELDS.forEach(function (pair) {
      if (record[pair[0]] !== undefined) fact(pair[1], displayValue(record[pair[0]]));
    });
    if (record.properties) fact("Properties", record.properties.join(", "));
    if (record.cost) fact("Cost", record.cost.text);
    if (count) box.appendChild(grid);
  }

  function displayValue(value) {
    if (typeof value === "boolean") return value ? "Yes" : "No";
    if (Array.isArray(value)) return value.join(", ");
    return String(value);
  }

  function humanizeType(value) {
    return String(value).replace(/([a-z])([A-Z])/g, "$1 $2");
  }

  function renderDamageDetails(box, damage) {
    var section = el("section", "structured-section");
    section.appendChild(el("h3", "structured-title", "Damage profile"));
    var grid = el("div", "attack-grid");
    damage.forEach(function (entry) {
      var card = el("div", "attack-card");
      card.appendChild(el("strong", null, entry.damageType || "Damage"));
      var roll = entry.damageRoll && entry.damageRoll.expression ? entry.damageRoll.expression : "Source text only";
      card.appendChild(el("span", null, "Roll: " + roll));
      grid.appendChild(card);
    });
    section.appendChild(grid);
    box.appendChild(section);
  }

  function renderAttackDetails(box, attacks) {
    var section = el("section", "structured-section");
    section.appendChild(el("h3", "structured-title", "Parsed attacks"));
    var grid = el("div", "attack-grid");
    attacks.forEach(function (attack) {
      var card = el("div", "attack-card");
      card.appendChild(el("strong", null, attack.name));
      var attackLine = [attack.attackType,
        attack.attackBonus !== undefined ? (attack.attackBonus >= 0 ? "+" : "") + attack.attackBonus + " to hit" : null,
        attack.reachFeet ? "reach " + attack.reachFeet + " ft." : null,
        attack.rangeFeet ? "range " + attack.rangeFeet.normal +
          (attack.rangeFeet.long ? "/" + attack.rangeFeet.long : "") + " ft." : null
      ].filter(Boolean).join(" · ");
      card.appendChild(el("span", null, attackLine));
      var damageLine = (attack.damageComponents || []).map(function (component) {
        var roll = component.damageRoll && component.damageRoll.expression ? component.damageRoll.expression : "flat";
        return component.averageDamage + " average · " + roll + " " + component.damageType;
      }).join(" + ");
      card.appendChild(el("span", null, damageLine));
      grid.appendChild(card);
    });
    section.appendChild(grid);
    box.appendChild(section);
  }

  function renderRelations(box, record) {
    var relationFields = [
      ["classes", "Class"], ["subclasses", "Subclass"], ["parentClass", "Parent class"],
      ["relatedTables", "Table"], ["fromTable", "Source table"], ["relatedRules", "Rule"],
      ["conditionImmunities", "Condition"], ["spellList", "Spell"]
    ];
    var section = el("section", "structured-section");
    section.appendChild(el("h3", "structured-title", "Connected records"));
    var linkCount = 0;
    relationFields.forEach(function (pair) {
      if (!record[pair[0]]) return;
      var values = Array.isArray(record[pair[0]]) ? record[pair[0]] : [record[pair[0]]];
      var links = el("div", "relation-list");
      values.forEach(function (ref) {
        if (!ref || !ref["@id"]) return;
        var parts = ref["@id"].split("/objects/")[1];
        if (!parts) return;
        var routeParts = parts.split("/");
        if (routeParts.length < 2) return;
        var slug = routeParts.slice(1).join("/");
        var a = link("#/" + routeParts[0] + "/" + slug, "relation-link");
        a.textContent = pair[1] + " · " + titleFromSlug(slug);
        links.appendChild(a);
        linkCount += 1;
      });
      if (!links.childNodes.length) return;
      if (links.childNodes.length > 16) {
        var details = el("details", "schema-details");
        details.appendChild(el("summary", null, pair[1] + " links · " + links.childNodes.length + " records"));
        details.appendChild(links);
        section.appendChild(details);
      } else {
        section.appendChild(links);
      }
    });
    if (linkCount) box.appendChild(section);
  }

  function titleFromSlug(slug) {
    return slug.split("-").map(function (part) {
      return part ? part.charAt(0).toUpperCase() + part.slice(1) : part;
    }).join(" ");
  }

  function renderAbilities(box, abilities) {
    var grid = el("div", "abilities");
    ["str", "dex", "con", "int", "wis", "cha"].forEach(function (key) {
      var ab = el("div", "ab");
      ab.appendChild(el("span", "k", key.toUpperCase()));
      var entry = abilities[key];
      if (entry) {
        ab.appendChild(el("span", "s", String(entry.score)));
        var mod = entry.modifier !== undefined ? (entry.modifier >= 0 ? "+" : "") + entry.modifier : "—";
        var save = entry.savingThrow !== undefined ? (entry.savingThrow >= 0 ? "+" : "") + entry.savingThrow : "—";
        ab.appendChild(el("span", "m", mod + " / " + save));
      } else {
        ab.appendChild(el("span", "s", "—"));
        ab.appendChild(el("span", "m", "not in source"));
      }
      grid.appendChild(ab);
    });
    box.appendChild(grid);
  }

  function renderDataTable(box, columns, rows) {
    var wrap = el("div", "tablewrap");
    var table = el("table", "data");
    var head = el("tr");
    columns.forEach(function (column) { head.appendChild(el("th", null, column)); });
    table.appendChild(head);
    (rows || []).forEach(function (row) {
      var tr = el("tr");
      row.cells.forEach(function (cell) {
        var td = el("td", null, cell.value);
        if (cell.colspan) td.setAttribute("colspan", cell.colspan);
        tr.appendChild(td);
      });
      table.appendChild(tr);
    });
    wrap.appendChild(table);
    box.appendChild(wrap);
  }
})();
</script>
</body>
</html>
