<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="SRD 5.2.1 JSON-LD 1.1 reference corpus and JSON Schema Draft 2020-12 specifications." />
<meta name="author" content="Chee Leong" />
<title>SRD 5.2.1 System JSON</title>
<link rel="license" href="https://creativecommons.org/licenses/by/4.0/legalcode" />
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Dataset",
  "name": "SRD 5.2.1 System JSON",
  "description": "A source-faithful JSON-LD 1.1 reference corpus and JSON Schema Draft 2020-12 specifications for the System Reference Document 5.2.1.",
  "url": "https://cheeleong.dev/graph20/",
  "creator": { "@type": "Person", "name": "Chee Leong" },
  "license": "https://creativecommons.org/licenses/by/4.0/legalcode",
  "isBasedOn": "https://cheeleong.dev/graph20/SRD_CC_v5.2.1.md",
  "inLanguage": "en",
  "keywords": ["ttrpg", "srd-5.2.1", "5e", "json-ld", "json-schema", "reference-corpus", "fair-data"],
  "distribution": [
    { "@type": "DataDownload", "name": "Manifest", "encodingFormat": "application/ld+json", "contentUrl": "https://cheeleong.dev/graph20/objects/srd52-system-data.jsonld" },
    { "@type": "DataDownload", "name": "Self-Contained Bundle", "encodingFormat": "application/ld+json", "contentUrl": "https://cheeleong.dev/graph20/objects/srd52-system-data.bundle.jsonld" },
    { "@type": "DataDownload", "name": "LLM Full Context", "encodingFormat": "text/plain", "contentUrl": "https://cheeleong.dev/graph20/llms-full.txt" }
  ]
}
</script>
<style>
  :root {
    --bg: #fbfaf8; --panel: #f2efe9; --panel2: #eae6de; --border: #ddd7cc;
    --text: #26211a; --muted: #6f6758; --accent: #8c3f1e; --accent-soft: #f3e2d8;
    --card: #ffffff; --code-bg: #f0ede6; --shadow: 0 1px 3px rgba(40,30,10,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161b; --panel: #1a1d24; --panel2: #20242d; --border: #2d323d;
      --text: #e8e6e1; --muted: #9a968c; --accent: #e08b5e; --accent-soft: #3a2a20;
      --card: #1d212a; --code-bg: #232833; --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: .8rem 1.4rem; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap; background: var(--panel);
  }
  header h1 { margin: 0; font-size: 1.05rem; }
  header h1 a { color: var(--text); text-decoration: none; }
  header .tag { color: var(--muted); font-size: .82rem; }
  #layout { display: flex; flex: 1; min-height: 0; }
  nav {
    width: 190px; flex: none; padding: .9rem .7rem; border-right: 1px solid var(--border);
    background: var(--panel); overflow-y: auto;
  }
  nav a {
    display: flex; justify-content: space-between; align-items: baseline; gap: .5rem;
    padding: .5rem .7rem; margin-bottom: .15rem; border-radius: 8px;
    color: var(--text); text-decoration: none; font-size: .92rem;
  }
  nav a:hover { background: var(--panel2); }
  nav a.active { background: var(--accent); color: #fff; }
  nav a .count { color: inherit; opacity: .6; font-size: .78em; }
  nav .navhead { color: var(--muted); font-size: .72rem; text-transform: uppercase;
    letter-spacing: .06em; padding: .8rem .7rem .3rem; }
  #list {
    width: 320px; flex: none; display: flex; flex-direction: column; min-height: 0;
    border-right: 1px solid var(--border); background: var(--bg);
  }
  #filterwrap { padding: .8rem .8rem .5rem; }
  #filter {
    width: 100%; padding: .55rem .75rem; border: 1px solid var(--border); border-radius: 9px;
    background: var(--card); color: var(--text); font: inherit;
  }
  #filter:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #filterhint { color: var(--muted); font-size: .72rem; padding: .25rem .9rem 0; }
  #items { overflow-y: auto; flex: 1; padding: .3rem .55rem 1rem; }
  #items .group {
    position: sticky; top: 0; background: var(--bg); color: var(--muted);
    font-size: .72rem; text-transform: uppercase; letter-spacing: .06em;
    padding: .7rem .45rem .25rem; border-bottom: 1px solid var(--border); margin-bottom: .2rem;
  }
  #items a {
    display: block; padding: .38rem .6rem; border-radius: 8px;
    color: var(--text); text-decoration: none;
  }
  #items a:hover { background: var(--panel2); }
  #items a.active { background: var(--accent-soft); }
  #items .nm { display: block; font-weight: 550; font-size: .92rem; }
  #items .sub { display: block; color: var(--muted); font-size: .77rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #detail { flex: 1; overflow-y: auto; padding: 1.6rem 2rem 3rem; min-width: 0; }
  .record { max-width: 46rem; }
  .record h2 { margin: 0 0 .1rem; font-size: 1.5rem; }
  .subtitle { color: var(--muted); font-style: italic; margin: 0 0 1rem; }
  .provenance { color: var(--muted); font-size: .78rem; margin: 0 0 1.4rem; }
  .provenance a { color: var(--accent); }
  .facts {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .6rem;
    margin: 0 0 1.2rem;
  }
  .fact { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: .5rem .7rem; box-shadow: var(--shadow); }
  .fact .k { display: block; color: var(--muted); font-size: .68rem; text-transform: uppercase; letter-spacing: .05em; }
  .fact .v { font-size: .9rem; overflow-wrap: anywhere; }
  .abilities { display: grid; grid-template-columns: repeat(6, minmax(64px, 1fr)); gap: .5rem;
    margin: 0 0 1.2rem; max-width: 34rem; }
  .ab { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    text-align: center; padding: .45rem .2rem; box-shadow: var(--shadow); }
  .ab .k { display: block; color: var(--muted); font-size: .68rem; letter-spacing: .05em; }
  .ab .s { font-size: 1.1rem; font-weight: 650; }
  .ab .m { display: block; color: var(--muted); font-size: .75rem; }
  .prose { white-space: pre-wrap; }
  .prose-first-hidden { display: none; }
  h3.sect { margin: 1.4rem 0 .4rem; font-size: 1.02rem; border-bottom: 1px solid var(--border); padding-bottom: .25rem; }
  .tablewrap { overflow-x: auto; margin: .9rem 0; }
  table.data { border-collapse: collapse; font-size: .86rem; background: var(--card); box-shadow: var(--shadow); }
  table.data td, table.data th { border: 1px solid var(--border); padding: .35rem .6rem; text-align: left; vertical-align: top; }
  table.data th { background: var(--panel2); }
  details.raw { margin-top: 2rem; }
  details.raw summary { cursor: pointer; color: var(--muted); font-size: .85rem; }
  pre { background: var(--code-bg); padding: .9rem; border-radius: 10px; overflow-x: auto; font-size: .78rem; }
  .placeholder { color: var(--muted); padding: .5rem .9rem; }
  /* landing */
  .landing { max-width: 52rem; }
  .landing h2 { font-size: 1.6rem; margin: .2rem 0 .4rem; }
  .landing .lede { color: var(--muted); max-width: 40rem; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: .8rem; margin: 1.4rem 0; }
  .cards a {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: .9rem 1rem; text-decoration: none; color: var(--text); box-shadow: var(--shadow);
  }
  .cards a:hover { border-color: var(--accent); }
  .cards .n { display: block; font-size: 1.5rem; font-weight: 700; color: var(--accent); }
  .cards .l { color: var(--muted); font-size: .85rem; }
  .landing h3 { margin: 1.6rem 0 .5rem; font-size: 1rem; }
  .landing ul { padding-left: 1.2rem; }
  .landing a { color: var(--accent); }
  .attribution { color: var(--muted); font-size: .78rem; border-top: 1px solid var(--border);
    margin-top: 2rem; padding-top: 1rem; max-width: 44rem; }
  @media (max-width: 920px) {
    #layout { flex-direction: column; }
    nav { width: auto; display: flex; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--border); padding: .5rem; }
    nav .navhead { display: none; }
    nav a { white-space: nowrap; }
    #list { width: auto; max-height: 40vh; border-right: none; border-bottom: 1px solid var(--border); }
    #detail { padding: 1.2rem 1rem 2.5rem; }
  }
</style>
</head>
<body>
<header>
  <h1><a href="#/">SRD 5.2.1 System JSON</a></h1>
  <span class="tag">source-faithful JSON-LD reference corpus · CC-BY-4.0</span>
</header>
<div id="layout">
  <nav id="nav"></nav>
  <div id="list">
    <div id="filterwrap"><input id="filter" type="search" placeholder="Filter…" autocomplete="off" /></div>
    <div id="filterhint">Type to filter · press Enter to full-text search everything</div>
    <div id="items"></div>
  </div>
  <main id="detail"></main>
</div>
<script>
(function () {
  "use strict";
  var LABELS = {
    classes: "Classes", subclasses: "Subclasses", species: "Species",
    backgrounds: "Backgrounds", feats: "Feats", equipment: "Equipment",
    spells: "Spells", conditions: "Conditions",
    "magic-items": "Magic Items", monsters: "Monsters",
    rules: "Rules", tables: "Tables", sources: "Sources"
  };
  var NAV_ORDER = ["classes", "subclasses", "species", "backgrounds", "feats",
    "equipment", "spells", "conditions", "magic-items", "monsters",
    "rules", "tables", "sources"];
  var colIndex = null, searchIndex = null, searchIndexPromise = null;
  var route = { collection: null, slug: null, search: null };

  var nav = document.getElementById("nav");
  var items = document.getElementById("items");
  var detail = document.getElementById("detail");
  var filter = document.getElementById("filter");

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  function link(href, cls) {
    var a = document.createElement("a");
    a.href = href; if (cls) a.className = cls;
    return a;
  }

  fetch("objects/collection-index.json")
    .then(function (r) { return r.json(); })
    .then(function (data) {
      colIndex = data.collections;
      window.addEventListener("hashchange", onRoute);
      onRoute();
    });

  function onRoute() {
    var hash = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
    var parts = hash.split("/").filter(Boolean);
    if (parts[0] === "search") {
      route = { collection: null, slug: null, search: parts.slice(1).join("/") };
      filter.value = route.search;
      renderNav();
      runGlobalSearch(route.search);
      return;
    }
    route = { collection: parts[0] || null, slug: parts[1] || null, search: null };
    renderNav();
    if (!route.collection || !colIndex[route.collection]) {
      route.collection = null;
      renderList(null);
      renderLanding();
      return;
    }
    renderList(route.collection);
    if (route.slug) {
      showRecord(route.collection, route.slug);
    } else {
      renderCollectionIntro(route.collection);
    }
  }

  function renderNav() {
    nav.textContent = "";
    nav.appendChild(el("div", "navhead", "Browse"));
    NAV_ORDER.forEach(function (name) {
      if (!colIndex[name]) return;
      var a = link("#/" + name, route.collection === name ? "active" : "");
      a.appendChild(el("span", null, LABELS[name] || name));
      a.appendChild(el("span", "count", String(colIndex[name].length)));
      nav.appendChild(a);
    });
  }

  // ---- list pane -----------------------------------------------------

  function renderList(collection, filterText) {
    items.textContent = "";
    if (!collection) {
      items.appendChild(el("p", "placeholder", "Pick a collection above, or press Enter in the box to search everything."));
      return;
    }
    filter.placeholder = "Filter " + (LABELS[collection] || collection).toLowerCase() + "…";
    var needle = (filterText || "").toLowerCase();
    var lastGroup = null, shown = 0;
    colIndex[collection].forEach(function (entry) {
      if (needle &&
          entry.name.toLowerCase().indexOf(needle) === -1 &&
          entry.sub.toLowerCase().indexOf(needle) === -1) return;
      if (entry.group !== lastGroup) {
        items.appendChild(el("div", "group", entry.group));
        lastGroup = entry.group;
      }
      var a = link("#/" + collection + "/" + entry.slug,
        route.slug === entry.slug ? "active" : "");
      a.appendChild(el("span", "nm", entry.name));
      if (entry.sub) a.appendChild(el("span", "sub", entry.sub));
      items.appendChild(a);
      shown += 1;
    });
    if (!shown) items.appendChild(el("p", "placeholder", "No matches in this collection. Press Enter to search everything."));
  }

  var filterTimer = null;
  filter.addEventListener("input", function () {
    clearTimeout(filterTimer);
    filterTimer = setTimeout(function () {
      if (route.collection) renderList(route.collection, filter.value.trim());
    }, 120);
  });
  filter.addEventListener("keydown", function (event) {
    if (event.key === "Enter" && filter.value.trim()) {
      location.hash = "#/search/" + encodeURIComponent(filter.value.trim());
    }
  });

  function ensureSearchIndex() {
    if (!searchIndexPromise) {
      searchIndexPromise = fetch("objects/search-index.json")
        .then(function (r) { return r.json(); })
        .then(function (idx) { searchIndex = idx; return idx; });
    }
    return searchIndexPromise;
  }

  function runGlobalSearch(query) {
    items.textContent = "";
    items.appendChild(el("p", "placeholder", "Searching…"));
    detail.textContent = "";
    detail.appendChild(el("p", "placeholder", "Full-text results for “" + query + "” are in the list."));
    ensureSearchIndex().then(function (idx) {
      var terms = query.toLowerCase().split(/\s+/).filter(function (t) { return t.length >= 3; });
      var hits = null;
      terms.forEach(function (term) {
        var matched = {};
        Object.keys(idx.tokens).forEach(function (token) {
          if (token.indexOf(term) === 0) {
            idx.tokens[token].forEach(function (doc) { matched[doc] = true; });
          }
        });
        hits = hits === null ? matched : intersect(hits, matched);
      });
      items.textContent = "";
      var docs = Object.keys(hits || {}).map(Number).slice(0, 300);
      if (!docs.length) {
        items.appendChild(el("p", "placeholder", "No matches anywhere."));
        return;
      }
      items.appendChild(el("div", "group", docs.length + " results"));
      docs.forEach(function (docIndex) {
        var doc = idx.documents[docIndex];
        var pathParts = doc.id.split("/"); // objects/<collection>/<slug>
        var a = link("#/" + pathParts[1] + "/" + pathParts[2]);
        a.appendChild(el("span", "nm", doc.name));
        a.appendChild(el("span", "sub", (LABELS[pathParts[1]] || doc.type) +
          (doc.excerpt ? " · " + doc.excerpt : "")));
        items.appendChild(a);
      });
    });
  }
  function intersect(a, b) {
    var out = {};
    Object.keys(a).forEach(function (k) { if (b[k]) out[k] = true; });
    return out;
  }

  // ---- detail pane ---------------------------------------------------

  function renderLanding() {
    detail.textContent = "";
    var box = el("div", "landing");
    box.appendChild(el("h2", null, "System Reference Document 5.2.1, as data"));
    box.appendChild(el("p", "lede",
      "Every rule, table, spell, feat, magic item, and monster from the SRD 5.2.1 as " +
      "individual JSON-LD records with verbatim source text, line-level provenance, and " +
      "JSON Schema validation. Browse a collection on the left, or type in the box and press Enter to search everything."));
    var cards = el("div", "cards");
    NAV_ORDER.forEach(function (name) {
      if (!colIndex[name] || name === "sources") return;
      var a = link("#/" + name);
      a.appendChild(el("span", "n", String(colIndex[name].length)));
      a.appendChild(el("span", "l", LABELS[name]));
      cards.appendChild(a);
    });
    box.appendChild(cards);
    box.appendChild(el("h3", null, "Get the data"));
    var ul = el("ul");
    [
      ["objects/srd52-system-data.jsonld", "Aggregate manifest (collection indexes + digests)"],
      ["objects/srd52-system-data.bundle.jsonld", "Single-file bundle — every record in one @graph (~4 MB)"],
      ["llms-full.txt", "LLM context file — the whole corpus as one plain-text document"],
      ["llms.txt", "llms.txt sitemap"],
      ["systems/context.jsonld", "JSON-LD context"],
      ["SPECIFICATION.md", "Technical specification"]
    ].forEach(function (pair) {
      var li = el("li");
      var a = link(pair[0]); a.textContent = pair[1];
      li.appendChild(a);
      ul.appendChild(li);
    });
    box.appendChild(ul);
    box.appendChild(el("p", "attribution",
      "This work includes material from the System Reference Document 5.2.1 (“SRD 5.2.1”) " +
      "by Wizards of the Coast LLC, available at https://www.dndbeyond.com/srd. The SRD 5.2.1 " +
      "is licensed under the Creative Commons Attribution 4.0 International License. " +
      "Independent, unofficial project — not affiliated with Wizards of the Coast."));
    detail.appendChild(box);
  }

  function renderCollectionIntro(collection) {
    detail.textContent = "";
    var box = el("div", "landing");
    box.appendChild(el("h2", null, LABELS[collection] || collection));
    box.appendChild(el("p", "lede", colIndex[collection].length +
      " records. Select one from the list, or type to filter."));
    detail.appendChild(box);
  }

  function showRecord(collection, slug) {
    detail.textContent = "";
    detail.appendChild(el("p", "placeholder", "Loading…"));
    var path = "objects/" + collection + "/" + slug + ".jsonld";
    fetch(path).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    }).then(function (record) {
      detail.textContent = "";
      var box = el("div", "record");
      box.appendChild(el("h2", null, record.name || slug));

      var subtitle = recordSubtitle(record);
      if (subtitle) box.appendChild(el("p", "subtitle", subtitle));

      var locator = record.sourceLocator;
      var prov = el("p", "provenance");
      if (locator) prov.appendChild(document.createTextNode(
        "SRD 5.2.1 · " + locator.chapter + " §" + locator.section +
        " · lines " + locator.lineStart + "–" + locator.lineEnd + " · "));
      var rawLink = link(path); rawLink.textContent = "raw JSON-LD";
      prov.appendChild(rawLink);
      box.appendChild(prov);

      renderFacts(box, record);
      if (record.coreTraits) {
        var grid = el("div", "facts");
        Object.keys(record.coreTraits).forEach(function (key) {
          var fact = el("div", "fact");
          fact.appendChild(el("span", "k", key));
          fact.appendChild(el("span", "v", record.coreTraits[key]));
          grid.appendChild(fact);
        });
        box.appendChild(grid);
      }
      if (record.abilities) renderAbilities(box, record.abilities);
      if (record.columns) renderDataTable(box, record.columns, record.rows);

      if (record["@type"] === "Species" && record.traits) {
        // Creature type/size/speed are in the subtitle; traits render as
        // headed sections below. Verbatim text stays in the raw JSON.
      } else if (record["@type"] === "Monster" && record.statSections) {
        // The stat lines are already shown in the facts/ability grids and the
        // verbatim text stays in the raw JSON below; render the named
        // sections (Traits, Actions, ...) as headed blocks.
        record.statSections.forEach(function (section) {
          box.appendChild(el("h3", "sect", section.name));
          box.appendChild(el("div", "prose", section.rulesText));
        });
      } else if (record.rulesText) {
        var text = stripSubtitle(record.rulesText, subtitle);
        if (record["@type"] === "Spell") {
          // Casting Time/Range/Components/Duration are already in the facts
          // grid; hide the duplicated header lines in display only.
          text = text.replace(/^(?:(?:Casting Time|Range|Components|Duration):[^\n]*\n+)+/, "");
        }
        box.appendChild(el("div", "prose", text));
      }
      (record.features || []).forEach(function (feature) {
        var title = (feature.level ? "Level " + feature.level + ": " : "") + feature.name;
        box.appendChild(el("h3", "sect", title));
        if (feature.rulesText) box.appendChild(el("div", "prose", feature.rulesText));
      });
      (record.traits || []).forEach(function (trait) {
        box.appendChild(el("h3", "sect", trait.name));
        box.appendChild(el("div", "prose", trait.rulesText));
      });
      (record.subclasses || []).forEach(function (ref) {
        var sslug = ref["@id"].split("/").pop();
        var p = el("p");
        var a = link("#/subclasses/" + sslug); a.textContent = "→ Subclass: " + sslug;
        p.appendChild(a);
        box.appendChild(p);
      });
      (record.relatedTables || []).forEach(function (ref) {
        var tslug = ref["@id"].split("/").pop();
        var p = el("p");
        var a = link("#/tables/" + tslug); a.textContent = "→ Table: " + tslug;
        p.appendChild(a);
        box.appendChild(p);
      });

      var raw = el("details", "raw");
      raw.appendChild(el("summary", null, "Raw record JSON"));
      raw.appendChild(el("pre", null, JSON.stringify(record, null, 2)));
      box.appendChild(raw);
      detail.appendChild(box);
      detail.scrollTop = 0;
      renderList(collection, filter.value.trim());
    }).catch(function () {
      detail.textContent = "";
      detail.appendChild(el("p", "placeholder", "Could not load " + path));
    });
  }

  function recordSubtitle(record) {
    if (record["@type"] === "Spell") {
      var lvl = record.level === 0 ? record.school + " Cantrip" : "Level " + record.level + " " + record.school;
      return lvl + " (" + (record.classAvailability || []).join(", ") + ")";
    }
    if (record["@type"] === "Monster") return record.sizeTypeAlignment || "";
    if (record["@type"] === "MagicItem") {
      var s = record.itemCategory + (record.categoryDetail ? " (" + record.categoryDetail + ")" : "") + ", " + record.rarity;
      if (record.attunementNote) s += " (" + record.attunementNote + ")";
      return s;
    }
    if (record["@type"] === "Feat") {
      return record.category + " Feat" + (record.prerequisite ? " (Prerequisite: " + record.prerequisite + ")" : "");
    }
    if (record["@type"] === "Species") {
      return [record.creatureType, record.size, record.speed].filter(Boolean).join(" · ");
    }
    if (record["@type"] === "Subclass") return record.parentClassName + " Subclass";
    if (record["@type"] === "Equipment") {
      if (record.equipmentType === "weapon")
        return [record.weaponCategory, record.attackType, "Weapon ·", record.damage].filter(Boolean).join(" ");
      if (record.equipmentType === "armor")
        return (record.armorCategory || "") + " Armor · AC " + record.armorClass;
      return "Adventuring Gear";
    }
    if (record["@type"] === "Condition") return "Condition";
    return "";
  }

  // The subtitle repeats the first line(s) of the verbatim prose; hide the
  // duplication in display only (raw JSON always shows the full text).
  function stripSubtitle(text, subtitle) {
    if (!subtitle) return text;
    var firstLine = text.split("\n", 1)[0].trim();
    if (firstLine.replace(/\s+/g, " ") === subtitle.replace(/\s+/g, " ")) {
      return text.slice(text.indexOf("\n") + 1).replace(/^\n+/, "");
    }
    return text;
  }

  var FACT_FIELDS = [
    ["castingTime", "Casting Time"], ["range", "Range"], ["components", "Components"],
    ["duration", "Duration"], ["armorClass", "AC"], ["initiative", "Initiative"],
    ["hitPoints", "HP"], ["speed", "Speed"], ["skills", "Skills"],
    ["resistances", "Resistances"], ["vulnerabilities", "Vulnerabilities"],
    ["immunities", "Immunities"], ["senses", "Senses"], ["languages", "Languages"],
    ["gear", "Gear"], ["challenge", "CR"],
    ["mastery", "Mastery"], ["weight", "Weight"],
    ["strengthRequirement", "Strength"], ["stealthEffect", "Stealth"],
    ["donDoffTime", "Don/Doff"], ["savingThrowAbility", "Save"]
  ];
  function renderFacts(box, record) {
    var grid = el("div", "facts");
    var count = 0;
    function fact(label, value) {
      var node = el("div", "fact");
      node.appendChild(el("span", "k", label));
      node.appendChild(el("span", "v", value));
      grid.appendChild(node);
      count += 1;
    }
    FACT_FIELDS.forEach(function (pair) {
      if (record[pair[0]] !== undefined) fact(pair[1], String(record[pair[0]]));
    });
    if (record.properties) fact("Properties", record.properties.join(", "));
    if (record.cost) fact("Cost", record.cost.text);
    if (count) box.appendChild(grid);
  }

  function renderAbilities(box, abilities) {
    var grid = el("div", "abilities");
    ["str", "dex", "con", "int", "wis", "cha"].forEach(function (key) {
      var ab = el("div", "ab");
      ab.appendChild(el("span", "k", key.toUpperCase()));
      var entry = abilities[key];
      if (entry) {
        ab.appendChild(el("span", "s", String(entry.score)));
        var mod = entry.modifier !== undefined ? (entry.modifier >= 0 ? "+" : "") + entry.modifier : "—";
        var save = entry.savingThrow !== undefined ? (entry.savingThrow >= 0 ? "+" : "") + entry.savingThrow : "—";
        ab.appendChild(el("span", "m", mod + " / " + save));
      } else {
        ab.appendChild(el("span", "s", "—"));
        ab.appendChild(el("span", "m", "not in source"));
      }
      grid.appendChild(ab);
    });
    box.appendChild(grid);
  }

  function renderDataTable(box, columns, rows) {
    var wrap = el("div", "tablewrap");
    var table = el("table", "data");
    var head = el("tr");
    columns.forEach(function (column) { head.appendChild(el("th", null, column)); });
    table.appendChild(head);
    (rows || []).forEach(function (row) {
      var tr = el("tr");
      row.cells.forEach(function (cell) {
        var td = el("td", null, cell.value);
        if (cell.colspan) td.setAttribute("colspan", cell.colspan);
        tr.appendChild(td);
      });
      table.appendChild(tr);
    });
    wrap.appendChild(table);
    box.appendChild(wrap);
  }
})();
</script>
</body>
</html>
