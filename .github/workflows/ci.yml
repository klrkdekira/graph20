name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: make check
      # The pipeline regenerates artifacts in place; a dirty tree here means
      # the committed generated files did not match a clean build.
      - run: git diff --exit-code && test -z "$(git status --porcelain)"
